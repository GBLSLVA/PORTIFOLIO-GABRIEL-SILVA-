name: Bootstrap navigation test lockfile

on:
  push:
    branches: [refactor/mobile-nav-a11y-tests]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mobile-nav-a11y-tests
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Use current npm release
        run: npm install --global npm@11
      - name: Update npm lockfile for new test dependencies
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund || { tail -n 150 /home/runner/.npm/_logs/*debug-0.log; exit 1; }
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: lock test dependencies"
          git pull --rebase origin refactor/mobile-nav-a11y-tests
          git push origin HEAD:refactor/mobile-nav-a11y-tests
