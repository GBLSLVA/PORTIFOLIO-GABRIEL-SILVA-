<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c10"/>
      <stop offset="1" stop-color="#0b1015"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="640" height="900" rx="28" fill="#0d1217"/>
  <path d="M640 0V900" stroke="#242d37"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="58" width="36" height="36" rx="11" fill="#58d6a3"/>
    <text x="82" y="83" text-anchor="middle" font-size="18" font-weight="800" fill="#06150f">Z</text>
    <text x="116" y="82" font-size="15" font-weight="800" letter-spacing="1.6" fill="#f7f9fb">ZEUS FINANCE</text>

    <text x="64" y="315" font-size="14" font-weight="800" letter-spacing="1.8" fill="#58d6a3">FINANÇAS SEM RUÍDO</text>
    <text x="64" y="380" font-size="62" font-weight="750" fill="#f7f9fb">
      <tspan x="64" dy="0">Veja o que</tspan>
      <tspan x="64" dy="62">importa. Decida</tspan>
      <tspan x="64" dy="62">com mais clareza.</tspan>
    </text>
    <text x="64" y="615" font-size="18" fill="#a9b4bf">
      <tspan x="64" dy="0">Um painel direto para gastos, dívidas e metas —</tspan>
      <tspan x="64" dy="30">sem planilhas espalhadas.</tspan>
    </text>
    <circle cx="74" cy="794" r="10" fill="#58d6a3" fill-opacity=".15"/>
    <path d="M69 794l3 3 7-8" fill="none" stroke="#58d6a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="800" font-size="14" fill="#8795a3">Seus registros ficam separados por conta e salvos no servidor.</text>

    <g transform="translate(790 185)" filter="url(#shadow)">
      <rect x="-48" y="-70" width="590" height="600" rx="30" fill="#0b1015" stroke="#242d37"/>
      <text x="0" y="0" font-size="14" font-weight="800" letter-spacing="1.8" fill="#58d6a3">BEM-VINDO DE VOLTA</text>
      <text x="0" y="62" font-size="48" font-weight="760" fill="#f7f9fb">Entre no seu painel.</text>
      <text x="0" y="104" font-size="16" fill="#a9b4bf">Use seu e-mail e senha para continuar de onde parou.</text>

      <text x="0" y="170" font-size="14" font-weight="700" fill="#f7f9fb">E-mail</text>
      <rect x="0" y="186" width="490" height="54" rx="11" fill="#0c1116" stroke="#34404c"/>
      <text x="18" y="219" font-size="15" fill="#5f6c79">voce@exemplo.com</text>

      <text x="0" y="285" font-size="14" font-weight="700" fill="#f7f9fb">Senha</text>
      <rect x="0" y="301" width="490" height="54" rx="11" fill="#0c1116" stroke="#34404c"/>
      <text x="18" y="335" font-size="18" letter-spacing="3" fill="#5f6c79">••••••••••••</text>
      <text x="0" y="383" font-size="12" fill="#8795a3">Use no mínimo 12 caracteres.</text>
      <text x="490" y="383" text-anchor="end" font-size="12" font-weight="700" fill="#58d6a3">Esqueci minha senha</text>

      <rect x="0" y="417" width="18" height="18" rx="4" fill="#0c1116" stroke="#34404c"/>
      <text x="31" y="431" font-size="12.5" font-weight="650" fill="#a9b4bf">Manter conectado por 30 dias</text>
      <text x="31" y="450" font-size="11" fill="#8795a3">Use apenas neste dispositivo se ele for confiável.</text>

      <rect x="0" y="480" width="490" height="54" rx="11" fill="#58d6a3"/>
      <text x="245" y="514" text-anchor="middle" font-size="15" font-weight="800" fill="#06150f">Entrar no ZEUS   →</text>
      <text x="0" y="572" font-size="13" font-weight="700" fill="#a9b4bf">Ainda não tenho conta</text>
    </g>
  </g>
</svg>